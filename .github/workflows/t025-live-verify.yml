name: T-025 APPS Parity Live Verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  live:
    name: Verify deployed APPS-parity Classroom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live CLONE shell, Classroom and Natural Beta
        shell: bash
        run: |
          set -euo pipefail
          clone='https://fitrajft-ux.github.io/FIEZEL-CLONE'
          supertonic='https://fitrajft-ux.github.io/FIEZEL-APPS/vendor/supertonic-3'
          verify_live() {
            stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
            curl -fsSL --connect-timeout 10 --max-time 30 "$clone/?verify=$stamp" -o /tmp/index.html
            curl -fsSL --connect-timeout 10 --max-time 30 "$clone/sw.js?verify=$stamp" -o /tmp/sw.js
            curl -fsSL --connect-timeout 10 --max-time 30 "$clone/FIEZEL-CLONE-APPS-PARITY.json?verify=$stamp" -o /tmp/parity.json
            curl -fsSL --connect-timeout 10 --max-time 30 "$clone/features/classroom/classroom-lessons-v1.json?verify=$stamp" -o /tmp/classroom.json
            curl -fsSL --connect-timeout 10 --max-time 30 "$clone/features/tutor-classroom/fiezel-tutor-v3.js?verify=$stamp" -o /tmp/tutor.js
            curl -fsSL --connect-timeout 10 --max-time 30 "$clone/features/neural-voice/fiezel-indonesian-human-prosody-lab.js?verify=$stamp" -o /tmp/lab.js

            grep -Fq './features/audio/fiezel-soundtrack.js' /tmp/index.html
            grep -Fq './features/library/fiezel-library.js' /tmp/index.html
            grep -Fq './features/library/fiezel-library-ui.js' /tmp/index.html
            grep -Fq './features/diagnostics/fiezel-diagnostic-bus.js' /tmp/index.html
            grep -Fq './features/daily-target/fiezel-daily-target.js' /tmp/index.html
            grep -Fq './features/classroom/fiezel-classroom.js' /tmp/index.html
            grep -Fq './features/tutor-classroom/fiezel-tutor-v3.js' /tmp/index.html
            grep -Fq './features/neural-voice/fiezel-indonesian-human-prosody-lab.js' /tmp/index.html
            ! grep -Fq 'spatial-dock' /tmp/index.html
            grep -Fq "SW_REV='m025-31-apps-m02548-parity-natural-beta-20260819-1'" /tmp/sw.js
            grep -Fq 'fiezel-clone-v${self.FIEZEL_VERSION}' /tmp/sw.js
            grep -Fq 'fiezel-clone-shell-${SW_REV}' /tmp/sw.js

            node - <<'NODE'
          const fs=require('fs');
          const parity=JSON.parse(fs.readFileSync('/tmp/parity.json','utf8'));
          if(parity.schema!=='fiezel-clone-apps-parity-v1') throw new Error('bad parity schema');
          if(parity.appsSource!=='d27046c9ab85654b9e0ea0520e9360643130ce49') throw new Error('bad APPS source');
          if(!parity.exactFiles || Object.keys(parity.exactFiles).length!==40) throw new Error('bad exact-file ledger');
          const pack=JSON.parse(fs.readFileSync('/tmp/classroom.json','utf8'));
          if(pack.schema!=='fiezel-classroom-lessons-v1') throw new Error('bad classroom schema');
          if(pack.version!=='1.2.0') throw new Error('bad classroom version');
          if(!Array.isArray(pack.categories)||pack.categories.length!==6) throw new Error('bad classroom categories');
          if(pack.curriculum?.lessonsByLevel?.A1!==35) throw new Error('bad A1 lesson count');
          NODE

            grep -Fq "fetch('./features/classroom/classroom-lessons-v1.json'" /tmp/tutor.js
            grep -Fq 'root.classroom = classroomV3' /tmp/tutor.js
            grep -Fq '.classroom-v3' /tmp/lab.js
            grep -Fq "getElementById('tutorSubtitle')" /tmp/lab.js
            grep -Fq "SOURCE_SHA='d27046c9ab85654b9e0ea0520e9360643130ce49'" /tmp/lab.js
            grep -Fq "MODEL_ID='supertonic-3-int8-2026-05-11'" /tmp/lab.js
            grep -Fq 'GENERATION_STEPS=4' /tmp/lab.js
            grep -Fq 'natural_beta_fallback_stable' /tmp/lab.js

            curl -fsSL --connect-timeout 10 --max-time 30 "$supertonic/tts.json?verify=$stamp" -o /tmp/tts.json
            curl -fsSL --connect-timeout 10 --max-time 30 "$supertonic/sherpa-onnx-tts.worker.js?verify=$stamp" -o /tmp/worker.js
            curl -fsSL --connect-timeout 10 --max-time 30 "$supertonic/voice.bin?verify=$stamp" -o /tmp/voice.bin
            test "$(wc -c < /tmp/tts.json | tr -d ' ')" = '8253'
            test "$(wc -c < /tmp/worker.js | tr -d ' ')" = '4709'
            test "$(wc -c < /tmp/voice.bin | tr -d ' ')" = '517168'
            grep -Fq '"sample_rate": 44100' /tmp/tts.json
            grep -Fq 'numThreads: 1' /tmp/worker.js
            grep -Fq 'generateWithConfig' /tmp/worker.js
            for asset in sherpa-onnx-wasm-main-tts.js sherpa-onnx-tts.js sherpa-onnx-wasm-main-tts.wasm duration_predictor.int8.onnx text_encoder.int8.onnx vector_estimator.int8.onnx vocoder.int8.onnx unicode_indexer.bin; do
              curl -fsSI --connect-timeout 10 --max-time 30 "$supertonic/$asset?verify=$stamp" >/dev/null
            done
          }

          for attempt in $(seq 1 30); do
            echo "T-025 live verification attempt ${attempt}/30"
            if verify_live; then
              echo 'LIVE_T025_APPS_PARITY_VERIFY_OK'
              exit 0
            fi
            sleep 10
          done
          echo 'LIVE_T025_APPS_PARITY_VERIFY_FAILED' >&2
          exit 1
